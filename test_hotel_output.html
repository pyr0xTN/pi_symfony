    <script>
        (function() {
            // Get the exact ID Symfony generated for the input
            const inputId = 'hotel_photo';
            const photoInput = document.getElementById(inputId);
            const preview = document.getElementById('imgPreview');

            // Make sure the input exists on the page to prevent JS errors
            if (photoInput) {
                photoInput.addEventListener('change', function (e) {
                    const file = e.target.files[0];
                    
                    if (file) {
                        // Check if it's actually an image
                        if (!file.type.startsWith('image/')) {
                            alert('Veuillez sélectionner une image valide.');
                            e.target.value = ''; 
                            return;
                        }

                        preview.src = URL.createObjectURL(file);
                        preview.style.display = 'block';

                        // Free up memory
                        preview.onload = function() {
                            URL.revokeObjectURL(preview.src);
                        };
                    } else {
                        // Hide preview if user cancels
                        preview.src = '#';
                        preview.style.display = 'none';
                    }
                });
            }

            // ── AI Description Logic ──
            const btnGenDesc = document.getElementById('btnGenDesc');
            const descInput  = document.getElementById('hotel_description');
            const nomInput   = document.getElementById('hotel_nom');

            if (btnGenDesc && descInput && nomInput) {
                btnGenDesc.addEventListener('click', async function (e) {
                    e.preventDefault();
                    const nomHotel = nomInput.value.trim();

                    if (!nomHotel) {
                        alert('Veuillez d\'abord saisir un nom d\'hôtel avant de générer la description.');
                        nomInput.focus();
                        return;
                    }

                    btnGenDesc.disabled = true;
                    btnGenDesc.textContent = '⏳ Génération...';

                    try {
                        const res = await fetch('/api/gemini/generate-description', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({
                                name: nomHotel,
                                type: 'hotel'
                            })
                        });

                        const data = await res.json();
                        
                        if (data.error) {
                            alert('Erreur IA : ' + data.error);
                        } else if (data.description) {
                            descInput.value = data.description;
                            descInput.classList.add('flash-highlight'); // Optional highlight
                            setTimeout(() => descInput.classList.remove('flash-highlight'), 1000);
                        }
                    } catch (err) {
                        console.error('Erreur génération IA:', err);
                        alert('Erreur réseau lors de la génération avec l\'IA.');
                    } finally {
                        btnGenDesc.disabled = false;
                        btnGenDesc.textContent = '✨ Générer par IA';
                    }
                });
            }

            // ── Autofill Logic ──
            const btnAutoFill = document.getElementById('btnAutoFill');

            if (btnAutoFill) {
                btnAutoFill.addEventListener('click', async function () {
                    const nomHotel = nomInput.value.trim();

                    if (!nomHotel) {
                        alert('Veuillez saisir un nom d\'hôtel avant de lancer l\'auto-remplissage.');
                        nomInput.focus();
                        return;
                    }

                    btnAutoFill.textContent = '⏳ Chargement...';
                    btnAutoFill.disabled = true;

                    try {
                        const res  = await fetch('/hotel/autofill?nomHotel=' + encodeURIComponent(nomHotel));
                        const data = await res.json();
                        console.log('Autofill data:', data);

                        if (data.error) {
                            alert('Erreur : ' + data.error);
                            return;
                        }

                        // Fill in the fields
                        const localisationInput = document.getElementById('hotel_localisation');
                        const etoilesInput      = document.getElementById('hotel_nombreEtoiles');
                        const descriptionInput  = document.getElementById('hotel_description');

                        if (localisationInput) localisationInput.value = data.localisation ?? '';
                        if (etoilesInput)      etoilesInput.value = data.nombreEtoiles ?? '';
                        if (descriptionInput)   descriptionInput.value = data.description ?? '';

                    } catch (err) {
                        console.error('Autofill error:', err);
                        alert('Erreur réseau : ' + err.message);
                    } finally {
                        btnAutoFill.textContent = '⚡ Auto remplissage';
                        btnAutoFill.disabled = false;
                    }
                });
            }
        })();
    </script>
