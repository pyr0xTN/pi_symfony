# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.upload_dir: '%kernel.project_dir%/public/uploads/images'
    aviationstack_api_key: '%env(AVIATIONSTACK_API_KEY)%'
    makcorps_api_key: '%env(MAKCORPS_API_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ── Integration branch services ───────────────────────────
    App\Service\WeatherService:
        arguments:
            $apiKey: '%env(OPENWEATHERMAP_API_KEY)%'

    App\Service\AiChatService:
        arguments:
            $apiKey: '%env(GROQ_API_KEY)%'

    App\Service\UnsplashService:
        arguments:
            $accessKey: '%env(UNSPLASH_ACCESS_KEY)%'

    App\Service\ImageUploadService:
        arguments:
            $uploadDir: '%app.upload_dir%'

    App\Service\AiSearchService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'

    # ── gestion_offre_last services ───────────────────────────
    App\Service\StripeService:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'
            $publicKey: '%env(STRIPE_PUBLIC_KEY)%'
            $appUrl:    '%env(APP_URL)%'

    App\Service\MailerSendService:
        arguments:
            $apiKey:    '%env(MAILERSEND_API_KEY)%'
            $fromEmail: '%env(MAILER_FROM_EMAIL)%'
            $fromName:  '%env(MAILER_FROM_NAME)%'

    App\Service\PdfTicketService:
        arguments:
            $twig: '@twig'

    App\Service\ExchangeRateService:
        arguments:
            $apiKey:       '%env(EXCHANGE_RATE_API_KEY)%'
            $baseCurrency: '%env(EXCHANGE_RATE_BASE_CURRENCY)%'

    App\Service\AiOfferService:
        arguments:
            $apiKey: '%env(GROQ_API_KEY)%'
